global:
  scrape_interval: 15s

rule_files:
  - "alert.rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'azure-vm'
    static_configs:
      - targets: ['20.24.8.253:9100']

  - job_name: 'aws-vm'
    static_configs:
      - targets: ['43.204.238.194:9100']

  - job_name: 'gcp-vm'
    static_configs:
      - targets: ['8.231.96.121:9100']
